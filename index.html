<html>

<head>
    <title>For my Hubby!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.jpg">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

    <div class="container text-center mt-5">
        <h1 class="display-4">I Have Something For You 🎁</h1>
    </div>

    <div class="container mt-6">
        <div class="row text-center">
            <div class="col-md-4 ml-5 mt-4">
                <button class="btn decorative-btn btn-lg mt-4" onclick="showSurprise()">
                    Open
                </button>

                <div id="surpriseMessage" class="mt-4 d-none card">
                    <div class="card shadow-lg p-4 text-center" style="max-width: 400px;">
                        <div class="card-body">
                            <h2>🎉 Happy Valentines Day Mama 💑</h2>
                            <p class="text-dark">You are my world 💖</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 ml-5 mt-4">
                <button onclick="playAudio()" class="btn decorative-btn btn-lg mt-4">
                    <i class="fa-solid fa-play"></i>
                </button>

                <audio id="myAudio" src="audio.mpeg"></audio>

                <button onclick="pauseAudio()" class="btn decorative-btn btn-lg mt-4">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>

            <div class="col-md-4 ml-5 mt-4">
                <button class="btn decorative-btn btn-lg mt-4" onclick="showPic()">
                    Click
                </button>

                <div id="imageContainer" class="hidden mt-4 mx-auto">
                    <img src="gowsha.jpeg" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
